<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Intelligence — Hazard Lens</title>
  <meta name="description" content="Multimodal environmental hazard assessment: Gemma 4 interprets satellite imagery alongside live river, flood, terrain, precipitation, and forest telemetry." />
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../assets/icons.css" />
  <style>
    :root {
      --bg: #171916;
      --surface: #1e221d;
      --surface-2: #252b24;
      --surface-elevated: #2f382e;
      --border: #364235;
      --border-highlight: #59745C;
      --text: #F0E9DC;
      --muted: #D7D3C7;
      --dim: #85877F;
      --accent: #D96B43;
      --forest: #59745C;
      --forest-dark: #254735;
      --lvl-low: #59745C;
      --lvl-moderate: #85877F;
      --lvl-high: #D96B43;
      --lvl-very_high: #D96B43;
      --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      --head: 'Outfit', var(--sans);
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; overflow: hidden; }

    #map { flex: 1; height: 100%; }
    .leaflet-container { background: #171916; }

    aside {
      width: 460px; max-width: 100%; height: 100%; overflow-y: auto;
      background: var(--surface); border-left: 1.5px solid var(--border);
      padding: 20px 20px 48px;
    }
    .header-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px;
    }
    h1 {
      font: 800 20px/1.2 var(--head); margin: 0; letter-spacing: .02em;
      display: flex; align-items: center; gap: 8px; color: #F0E9DC;
    }
    h1 .ei-icon { color: var(--accent); }
    .sub { color: var(--muted); margin: 4px 0 14px; font-size: 13px; line-height: 1.45; }
    .badge-gemma {
      display: inline-flex; gap: 6px; align-items: center; font: 600 11px var(--mono);
      padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border);
      color: #F0E9DC; background: var(--surface-2);
    }

    form { display: flex; gap: 8px; margin: 14px 0 10px; }
    input[type=search] {
      flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 12px; font: inherit; font-size: 13px;
    }
    input[type=search]:focus { outline: none; border-color: var(--accent); }
    button.btn-go {
      background: var(--forest-dark); color: #F0E9DC; border: 1px solid var(--forest);
      border-radius: 6px; padding: 10px 16px; font: 600 13px var(--sans); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: background .2s, border-color .2s;
    }
    button.btn-go:hover { background: var(--forest); }
    button:disabled { opacity: .5; cursor: wait; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .presets button {
      background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
      padding: 5px 10px; font-weight: 500; font-size: 12px; border-radius: 6px;
      cursor: pointer; transition: color .15s, border-color .15s;
    }
    .presets button:hover { color: var(--text); border-color: var(--forest); }

    .hint {
      color: var(--muted); font-size: 13px; border: 1px dashed var(--border);
      border-radius: 10px; padding: 16px; display: flex; align-items: center; gap: 10px;
      background: rgba(16, 185, 129, 0.03);
    }
    .hint .ei-icon { color: var(--forest); flex-shrink: 0; }

    .card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-top: 14px;
    }
    .card h2 {
      font: 700 12px var(--sans); letter-spacing: .08em; text-transform: uppercase;
      color: var(--forest); margin: 0 0 10px; display: flex; align-items: center; gap: 6px;
    }
    .headline { font: 600 16px/1.35 var(--head); margin: 8px 0 4px; color: #f8fafc; }
    .lvl {
      display: inline-block; font: 700 11px var(--mono); text-transform: uppercase;
      padding: 3px 8px; border-radius: 6px; color: #04100c;
    }
    .lvl.low { background: var(--lvl-low); }
    .lvl.moderate { background: var(--lvl-moderate); }
    .lvl.high { background: var(--lvl-high); }
    .lvl.very_high { background: var(--lvl-very_high); color: #fff; }

    .hz { border-top: 1px solid var(--border); padding: 12px 0 4px; }
    .hz:first-of-type { border-top: 0; padding-top: 0; }
    .hz-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .hz-name { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .hz-name .ei-icon { color: var(--accent); }
    .hz p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .hz b { color: var(--text); font-weight: 600; }
    .conf { color: var(--dim); font: 11px var(--mono); margin-top: 4px; }

    ul { margin: 0; padding-left: 20px; }
    li { margin: 4px 0; color: #cbd5e1; }
    .meta { color: var(--dim); font: 11px/1.5 var(--mono); margin-top: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    td { padding: 5px 0; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,.05); }
    td:first-child { color: var(--muted); padding-right: 12px; white-space: nowrap; }
    td:last-child { text-align: right; font-family: var(--mono); color: #f1f5f9; }
    .src { color: var(--dim); font-size: 11px; margin: 4px 0 8px; line-height: 1.4; }

    .loading { display: flex; gap: 12px; align-items: center; color: var(--muted); }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
    .view-switch {
      display: flex; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px; gap: 3px; margin-top: 6px;
    }
    .view-switch[hidden] { display: none; }
    .view-switch button {
      flex: 1; background: transparent; color: var(--muted); padding: 7px;
      font-weight: 600; border: 0; border-radius: 7px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .view-switch button[aria-selected="true"] { background: var(--forest); color: #04100c; }
    #out.data-only .reading-card { display: none; }
    .source-tag {
      display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono);
      padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
    }
    .source-tag.gemma { color: var(--accent); background: rgba(56,189,248,.12); }
    .source-tag.backup { color: #94a3b8; background: rgba(148,163,184,.12); }
    .source-tag.rules { color: #94a3b8; background: rgba(148,163,184,.12); }
    .retry {
      margin-top: 10px; background: transparent; color: var(--accent);
      border: 1px solid rgba(56,189,248,.5); padding: 6px 12px; border-radius: 6px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
    }
    .err a { color: var(--accent); }
    .err code { font-family: var(--mono); color: var(--text); }

    @media (max-width: 760px) {
      body { flex-direction: column; overflow: auto; }
      #map { height: 45vh; flex: none; }
      aside { width: 100%; height: auto; border-left: 0; border-top: 1px solid var(--border); padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Earth Intelligence world map: click any region for multimodal hazard assessment"></div>

  <aside>
    <div class="header-bar">
      <h1><span data-icon="satellite"></span> Hazard Lens</h1>
      <span class="badge-gemma"><span data-icon="sparkles"></span> Gemma 4 Multimodal</span>
    </div>
    <p class="sub">Click anywhere on Earth. Gemma 4 interprets satellite imagery concurrently with live river discharge, flood projections, terrain relief, precipitation, and soil profiles.</p>

    <form id="search">
      <input type="search" id="q" placeholder="Search location (e.g. Joshimath, Cologne)" aria-label="Search a place" />
      <button type="submit" class="btn-go"><span data-icon="search"></span> Scan</button>
    </form>
    <div class="presets" id="presets"></div>

    <div class="view-switch" id="view-switch" role="tablist" aria-label="Display View" hidden>
      <button type="button" role="tab" data-view="reading" aria-selected="true"><span data-icon="sparkles"></span> AI Reading</button>
      <button type="button" role="tab" data-view="data" aria-selected="false"><span data-icon="chart"></span> Observation Data</button>
    </div>
    <div id="out">
      <div class="hint">
        <span data-icon="crosshair"></span>
        <span>Select a benchmark site above, search any coordinate, or click directly on the geospatial map.</span>
      </div>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/icons.js"></script>
  <script>
    'use strict';
    // Initialize standard vector icons
    if (window.EarthIcons) window.EarthIcons.renderAll();

    const PRESETS = {
      river: [
        { name: 'Joshimath, Chamoli (India)', lat: 30.555, lon: 79.565 },
        { name: 'Rhine at Cologne (Germany)', lat: 50.94, lon: 6.96 },
        { name: 'Amazon near Manaus (Brazil)', lat: -3.13, lon: -59.95 },
        { name: 'Derna, Libya (Dam site)', lat: 32.76, lon: 22.64 },
        { name: 'Sindh, Indus (Pakistan)', lat: 26.2, lon: 68.37 },
      ],
      forest: [
        { name: 'Lábrea, Amazonas (Brazil)', lat: -7.6, lon: -64.6 },
        { name: 'Novo Progresso, Pará (Brazil)', lat: -7.1, lon: -55.4 },
        { name: 'Porto Velho, Rondônia (Brazil)', lat: -9.2, lon: -64.4 },
        { name: 'São Félix do Xingu, Pará (Brazil)', lat: -6.6, lon: -52.3 },
        { name: 'Riau, Sumatra (Indonesia)', lat: -0.2, lon: 101.95 },
      ],
    };
    let mode = new URLSearchParams(location.search).get('mode') === 'forest' ? 'forest' : 'river';

    const map = L.map('map', { worldCopyJump: true, zoomControl: false }).setView([25, 20], 3);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
    }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, opacity: 0.8,
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const out = document.getElementById('out');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (v, unit = '') => (v === null || v === undefined ? '—' : `${typeof v === 'number' ? v.toLocaleString() : esc(v)}${unit}`);

    const HAZARD_LABELS = {
      flood: 'Flood Risk',
      landslide: 'Landslide Vulnerability',
      debris_flow: 'Debris Flow Risk',
      erosion_sediment: 'Erosion & Siltation',
      deforestation: 'Canopy Deforestation',
      drought_low_flow: 'Drought & Low Flow',
      glacial: 'Glacial Outburst (GLOF)',
      other: 'Environmental Hazard',
    };

    const HAZARD_ICON_NAMES = {
      flood: 'river',
      landslide: 'mountain',
      debris_flow: 'mountain',
      erosion_sediment: 'layers',
      deforestation: 'forest',
      drought_low_flow: 'droplet',
      glacial: 'sparkles',
      other: 'hazard',
    };

    const levelText = l => esc(String(l || '').replace('_', ' '));

    function showPresets() {
      const pList = PRESETS[mode] || PRESETS.river;
      document.getElementById('presets').replaceChildren(...pList.map(p => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = p.name;
        b.onclick = () => assess(p.lat, p.lon, p.name);
        return b;
      }));
    }
    showPresets();

    window.addEventListener('message', e => {
      if (e.origin !== location.origin || e.data?.type !== 'hazard-mode') return;
      if (e.data.mode !== mode && PRESETS[e.data.mode]) { mode = e.data.mode; showPresets(); }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && window.parent !== window) window.parent.postMessage({ type: 'close-hazard-lens' }, location.origin);
    });

    map.on('click', e => assess(e.latlng.lat, ((e.latlng.lng + 540) % 360) - 180));

    document.getElementById('search').addEventListener('submit', async e => {
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
        const [hit] = await r.json();
        if (!hit) {
          out.innerHTML = `<div class="card err">No geographic entity found for “${esc(q)}”.</div>`;
          return;
        }
        assess(+hit.lat, +hit.lon, hit.display_name.split(',').slice(0, 2).join(','));
      } catch {
        out.innerHTML = '<div class="card err">Geocoding service unavailable. Click the map directly.</div>';
      }
    });

    const SERVER_HINT = location.protocol === 'file:'
      ? 'The Hazard Lens requires the Earth Intelligence server: run <code>npm start</code>, then visit <a href="http://localhost:8080/" target="_top">http://localhost:8080</a>.'
      : 'The server did not answer. Verify that the backend process is running.';
    if (location.protocol === 'file:') {
      out.innerHTML = `<div class="card err">${SERVER_HINT}</div>`;
    }

    let busy = false;
    let lastPlace = null;
    let view = 'reading';
    const viewSwitch = document.getElementById('view-switch');
    viewSwitch.addEventListener('click', e => {
      const b = e.target.closest('button[data-view]');
      if (!b) return;
      view = b.dataset.view;
      viewSwitch.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      out.classList.toggle('data-only', view === 'data');
    });

    async function assess(lat, lon, name) {
      lastPlace = { lat, lon, name };
      if (busy) return;
      if (location.protocol === 'file:') {
        out.innerHTML = `<div class="card err">${SERVER_HINT}</div>`;
        return;
      }
      busy = true;
      document.querySelectorAll('button').forEach(b => (b.disabled = true));
      layer.clearLayers();
      L.circleMarker([lat, lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#10b981', fillOpacity: 1 }).addTo(layer);
      map.flyTo([lat, lon], Math.max(map.getZoom(), 11), { duration: 1.2 });

      const steps = [
        'Retrieving multi-spectral satellite imagery…',
        'Gathering DEM terrain relief & GloFAS discharge telemetry…',
        'Executing HydroRIVERS downstream network routing…',
        'Gemma 4 synthesizing satellite imagery with in-situ data…',
        'Synthesizing probabilistic hazard classification…'
      ];
      let s = 0;
      out.innerHTML = `<div class="card loading"><div class="spinner"></div><span id="step">${steps[0]}</span></div>`;
      const timer = setInterval(() => {
        s = Math.min(s + 1, steps.length - 1);
        const el = document.getElementById('step');
        if (el) el.textContent = steps[s];
      }, 5000);

      try {
        const res = await fetch('/api/v1/hazard', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ lat, lon, name, focus: mode }), signal: AbortSignal.timeout(150000),
        });
        const r = await res.json().catch(() => {
          throw new Error(`The server sent an unexpected reply (HTTP ${res.status}).`);
        });
        if (!res.ok) throw new Error(r.error || `HTTP ${res.status}`);
        draw(r);
      } catch (err) {
        const msg = err.name === 'TimeoutError'
          ? 'Analysis timed out (exceeded 2.5 minutes). Try again.'
          : esc(err.message);
        out.innerHTML = `<div class="card err">Hazard assessment failed: ${msg}</div>`;
      } finally {
        clearInterval(timer);
        busy = false;
        document.querySelectorAll('button').forEach(b => (b.disabled = false));
      }
    }

    function draw(r) {
      if (r.image?.bbox) {
        const [w, s, e, n] = r.image.bbox;
        L.rectangle([[s, w], [n, e]], { color: '#38bdf8', weight: 1.5, fill: false, dashArray: '4 4' })
          .bindTooltip('Satellite Observation Field of View (Esri/Maxar)').addTo(layer);
      }
      if (r.riverPath?.length > 1) {
        L.polyline(r.riverPath, { color: '#10b981', weight: 3.5, opacity: 0.9 })
          .bindTooltip('Downstream HydroRIVERS Corridor (300 km)').addTo(layer);
      }

      const d = r.data || {};
      const t = d.terrain, rain = d.rainfall, f = d.river_flow_forecast, rv = d.nearest_river;
      let html = '';

      const a = r.reading;
      const SOURCE = {
        gemma: `<span class="source-tag gemma"><span data-icon="sparkles"></span> Gemma 4 Multimodal · ${esc(r.model)} via ${r.provider === 'bedrock' ? 'Amazon Bedrock' : 'Google AI Studio'}</span>`,
        backup: `<span class="source-tag backup"><span data-icon="sparkles"></span> AI Model Interpretation</span>`,
        rules: `<span class="source-tag rules"><span data-icon="activity"></span> Empirical Rule Baseline</span>`,
      };
      html += `<div class="card reading-card">
        ${SOURCE[r.readingSource] || ''}
        <h2><span data-icon="pin"></span> ${esc(r.place)}</h2>
        <span class="lvl ${esc(a.overall_level)}">Risk Level: ${levelText(a.overall_level)}</span>
        <p class="headline">${esc(a.headline)}</p>
        <div class="meta">Latency: ${(r.tookMs / 1000).toFixed(1)} s${r.aiError ? ` · Telemetry Note: ${esc(r.aiError)}` : ''}</div>
        ${r.readingSource !== 'gemma' ? '<button type="button" class="retry" id="retry"><span data-icon="refresh"></span> Retry with Gemma 4</button>' : ''}
      </div>`;

      if (a.hazards.length) {
        html += `<div class="card reading-card"><h2><span data-icon="hazard"></span> Detected Hazard Vectors</h2>${a.hazards.map(h => {
          const iconName = HAZARD_ICON_NAMES[h.type] || 'hazard';
          const label = HAZARD_LABELS[h.type] || esc(h.type);
          return `
          <div class="hz">
            <div class="hz-top">
              <span class="hz-name"><span data-icon="${iconName}"></span> ${label}</span>
              <span class="lvl ${esc(h.level)}">${levelText(h.level)}</span>
            </div>
            <p><b>Observed in imagery:</b> ${esc(h.evidence_image)}</p>
            <p><b>Sensor Evidence:</b> ${esc(h.evidence_data)}</p>
            <div class="conf">Confidence Level: ${esc(h.confidence)}</div>
          </div>`;
        }).join('')}</div>`;
      }

      if (a.image_observations.length) {
        html += `<div class="card reading-card"><h2><span data-icon="satellite"></span> Satellite Image Interpretation</h2><ul>${a.image_observations.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      }
      if (a.actions.length) {
        html += `<div class="card reading-card"><h2><span data-icon="shieldCheck"></span> Recommended Interventions</h2><ul>${a.actions.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      }
      if (a.data_gaps.length) {
        html += `<div class="card reading-card"><h2><span data-icon="info"></span> Evidence Gaps & Field Verification</h2><ul>${a.data_gaps.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      }

      html += '<div class="card"><h2><span data-icon="chart"></span> In-Situ & Geospatial Telemetry</h2><table>';
      if (f) {
        html += `<tr><td>River Discharge Today</td><td>${fmt(f.today_cms, ' m³/s')}</td></tr>
          <tr><td>14-Day Forecast Peak</td><td>${fmt(f.forecast_peak_14d_cms, ' m³/s')} (${esc(f.forecast_peak_date)})</td></tr>
          <tr><td>2-Year Flood Recurrence Threshold</td><td>${fmt(f.approx_2yr_flood_cms, ' m³/s')}</td></tr>
          <tr><td>Peak / 2-Year Ratio</td><td>${fmt(f.peak_vs_2yr_flood)}</td></tr>`;
      }
      if (rv && rv.mean_discharge_cms !== undefined) {
        html += `<tr><td>Nearest HydroRIVERS Reach</td><td>${fmt(rv.distance_km, ' km')}</td></tr>
          <tr><td>Long-Term Mean Flow</td><td>${fmt(rv.mean_discharge_cms, ' m³/s')}</td></tr>
          <tr><td>Upstream Basin Area</td><td>${fmt(rv.upstream_area_km2, ' km²')}</td></tr>
          <tr><td>Distance to Coastal Basin Outlet</td><td>${fmt(rv.distance_to_mouth_km, ' km')}</td></tr>`;
      }
      if (t) {
        html += `<tr><td>Terrain Elevation</td><td>${fmt(t.elevation_m, ' m')}</td></tr>
          <tr><td>Relief Gradient within 1 km</td><td>${fmt(t.relief_within_1km_m, ' m')}</td></tr>
          <tr><td>Maximum Slope Gradient</td><td>${fmt(t.max_slope_deg, '°')}</td></tr>`;
      }
      if (rain) {
        html += `<tr><td>Precipitation (Past 7 Days)</td><td>${fmt(rain.past_7_days_mm, ' mm')}</td></tr>
          <tr><td>Precipitation Forecast (Next 3 Days)</td><td>${fmt(rain.next_3_days_mm, ' mm')}</td></tr>`;
      }
      const tl = d.tree_cover_loss;
      if (tl) {
        html += `<tr><td>Canopy Loss 2021–2024 (~${tl.area_km2} km²)</td><td>${fmt(tl.total_2021_2024_ha, ' ha')}</td></tr>` +
          Object.entries(tl.natural_forest_loss_ha_by_year || {}).map(([y, v]) => `<tr><td>&nbsp;&nbsp;Year ${esc(y)} Loss</td><td>${fmt(v, ' ha')}</td></tr>`).join('');
      }
      html += '</table>';
      const sources = [r.image?.source, f?.source, rv?.source, t?.source, rain?.source, d.soil?.source, tl?.source].filter(Boolean);
      html += `<div class="src">Data Sources: ${sources.map(esc).join(' · ')}</div>`;
      if (r.missing?.length) html += `<div class="src">Telemetry Gaps: ${r.missing.map(esc).join(', ')}</div>`;
      html += '</div>';

      out.innerHTML = html;
      viewSwitch.hidden = false;
      if (window.EarthIcons) window.EarthIcons.renderAll(out);
      document.getElementById('retry')?.addEventListener('click', () => lastPlace && assess(lastPlace.lat, lastPlace.lon, lastPlace.name));
    }
  </script>
</body>
</html>
