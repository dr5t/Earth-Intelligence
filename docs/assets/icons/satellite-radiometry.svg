<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Tile Base: Warm Paper with Solid Ink Contour -->
  <rect x="2" y="2" width="44" height="44" rx="8" fill="#F0E9DC" stroke="#171916" stroke-width="2"/>
  
  <!-- Nadir Ground Target Swath Lines -->
  <polygon points="12,38 36,38 27,22 21,22" fill="#59745C" fill-opacity="0.15" stroke="#D7D3C7" stroke-width="1.2" stroke-dasharray="2 2"/>
  <ellipse cx="24" cy="38" rx="14" ry="4" stroke="#171916" stroke-width="1.75"/>
  <line x1="16" y1="38" x2="32" y2="38" stroke="#D96B43" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Satellite Sensor Chassis -->
  <rect x="19" y="10" width="10" height="12" rx="2" fill="#F0E9DC" stroke="#171916" stroke-width="1.75"/>
  
  <!-- Solar Array Wings (Left & Right) -->
  <rect x="8" y="12" width="9" height="8" rx="1" fill="#254735" fill-opacity="0.3" stroke="#171916" stroke-width="1.5"/>
  <line x1="8" y1="16" x2="17" y2="16" stroke="#171916" stroke-width="1"/>
  <line x1="12.5" y1="12" x2="12.5" y2="20" stroke="#171916" stroke-width="1"/>
  
  <rect x="31" y="12" width="9" height="8" rx="1" fill="#254735" fill-opacity="0.3" stroke="#171916" stroke-width="1.5"/>
  <line x1="31" y1="16" x2="40" y2="16" stroke="#171916" stroke-width="1"/>
  <line x1="35.5" y1="12" x2="35.5" y2="20" stroke="#171916" stroke-width="1"/>
  
  <!-- Optical Aperture & Signal Orange Nadir Emitter -->
  <circle cx="24" cy="18" r="3" fill="#D96B43" stroke="#171916" stroke-width="1.5"/>
  <circle cx="24" cy="18" r="1" fill="#F0E9DC"/>
</svg>
