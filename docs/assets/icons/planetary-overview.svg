<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Tile Base: Warm Paper with Solid Ink Contour -->
  <rect x="2" y="2" width="44" height="44" rx="8" fill="#F0E9DC" stroke="#171916" stroke-width="2"/>
  
  <!-- Planetary Sphere Horizon -->
  <circle cx="24" cy="24" r="16" fill="#D7D3C7" fill-opacity="0.3" stroke="#171916" stroke-width="2"/>
  
  <!-- Equatorial Geodetic Baseline -->
  <line x1="8" y1="24" x2="40" y2="24" stroke="#171916" stroke-width="1.75"/>
  
  <!-- Tropic Parallels (23.5° N / S) -->
  <path d="M12 16c4 2 12 2 24 0" stroke="#85877F" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M12 32c4-2 12-2 24 0" stroke="#85877F" stroke-width="1.2" stroke-dasharray="2 2"/>
  
  <!-- Prime Meridian Elliptical Arc -->
  <path d="M24 8c-6 4-9 10-9 16s3 12 9 16" stroke="#254735" stroke-width="1.5"/>
  <path d="M24 8c6 4 9 10 9 16s-3 12-9 16" stroke="#59745C" stroke-width="1.5"/>
  
  <!-- Signal Orange Apex Observation Marker -->
  <circle cx="24" cy="14" r="3.5" fill="#D96B43" stroke="#171916" stroke-width="1.5"/>
  <circle cx="24" cy="14" r="1" fill="#F0E9DC"/>
</svg>
