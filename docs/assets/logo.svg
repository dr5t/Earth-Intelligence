<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="ei-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a1f" />
      <stop offset="70%" stop-color="#061812" />
      <stop offset="100%" stop-color="#040d0a" />
    </radialGradient>
    <linearGradient id="ei-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="ei-river" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ei-terrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="ei-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate & Planetary Atmosphere -->
  <circle cx="60" cy="60" r="54" fill="url(#ei-bg)" stroke="#134e40" stroke-width="1.2" />
  
  <!-- Outer Geospatial Coordinate Graticule -->
  <circle cx="60" cy="60" r="50" stroke="#10b981" stroke-width="0.7" stroke-dasharray="2 3" stroke-opacity="0.4" />
  <circle cx="60" cy="60" r="42" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3" />
  
  <!-- Cardinal Graticule Ticks -->
  <line x1="60" y1="3" x2="60" y2="9" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="111" x2="60" y2="117" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="3" y1="60" x2="9" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="111" y1="60" x2="117" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Latitude Parallels -->
  <ellipse cx="60" cy="44" rx="36" ry="12" stroke="#1e5245" stroke-width="0.7" stroke-dasharray="1.5 2" stroke-opacity="0.6" fill="none" />
  <ellipse cx="60" cy="60" rx="42" ry="14" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3" fill="none" />
  <ellipse cx="60" cy="76" rx="36" ry="12" stroke="#1e5245" stroke-width="0.7" stroke-dasharray="1.5 2" stroke-opacity="0.6" fill="none" />

  <!-- Central Longitude Meridian -->
  <ellipse cx="60" cy="60" rx="16" ry="42" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.35" fill="none" />

  <!-- Stylized Landmass & Forest Contours -->
  <path d="M42 32 C48 30, 56 34, 62 31 C68 28, 76 33, 78 40 C80 47, 73 54, 76 62 C78 68, 71 77, 65 79 C59 81, 54 88, 48 86 C42 84, 38 76, 40 70 C42 64, 34 58, 35 50 C36 42, 38 34, 42 32 Z" 
        fill="url(#ei-terrain)" fill-opacity="0.18" stroke="#10b981" stroke-width="1" stroke-linejoin="round" />

  <!-- Inner Forest Core -->
  <path d="M46 38 C52 36, 58 40, 64 38 C70 42, 72 48, 69 54 C66 60, 68 67, 62 72 C56 74, 50 68, 46 62 C42 56, 44 44, 46 38 Z"
        fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- Hydrological Network / River Veins -->
  <path d="M58 32 Q54 44 60 52 T54 70 T48 84" 
        stroke="url(#ei-river)" stroke-width="1.8" stroke-linecap="round" fill="none" filter="url(#ei-glow)" />
  <path d="M60 52 Q66 56 71 62" 
        stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M56 62 Q50 66 44 67" 
        stroke="#38bdf8" stroke-width="1" stroke-linecap="round" fill="none" />
  <path d="M63 42 Q68 45 72 44" 
        stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.8" fill="none" />

  <!-- Orbital Satellite Trajectory Ellipse -->
  <ellipse cx="60" cy="60" rx="55" ry="22" transform="rotate(-32 60 60)" 
           stroke="url(#ei-orbit)" stroke-width="1.3" stroke-linecap="round" fill="none" />

  <!-- Satellite Node Alpha (Observation Platform) -->
  <g transform="translate(98, 34) rotate(-32)">
    <!-- Satellite Body -->
    <rect x="-3" y="-2" width="6" height="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="0.6" rx="0.8" />
    <!-- Solar Panels -->
    <line x1="-7" y1="0" x2="-3" y2="0" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="-9" y="-2.5" width="2" height="5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="3" y1="0" x2="7" y2="0" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="7" y="-2.5" width="2" height="5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.5" />
    <!-- Signal Beam -->
    <circle cx="0" cy="0" r="1.5" fill="#38bdf8" filter="url(#ei-glow)" />
  </g>

  <!-- Satellite Node Beta (Sensory Node) -->
  <g transform="translate(22, 86) rotate(-32)">
    <circle cx="0" cy="0" r="2.2" fill="#10b981" filter="url(#ei-glow)" />
    <circle cx="0" cy="0" r="4.5" stroke="#34d399" stroke-width="0.6" stroke-dasharray="1 1.5" />
  </g>
</svg>
