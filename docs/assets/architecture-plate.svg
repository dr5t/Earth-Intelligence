  <line x1="936" y1="16" x2="952" y2="16" stroke="#171916" stroke-width="1.5"/>
  <line x1="944" y1="8" x2="944" y2="24" stroke="#171916" stroke-width="1.5"/>
  <line x1="8" y1="544" x2="24" y2="544" stroke="#171916" stroke-width="1.5"/>
  <line x1="16" y1="536" x2="16" y2="552" stroke="#171916" stroke-width="1.5"/>
  <line x1="936" y1="544" x2="952" y2="544" stroke="#171916" stroke-width="1.5"/>
  <line x1="944" y1="536" x2="944" y2="552" stroke="#171916" stroke-width="1.5"/>

